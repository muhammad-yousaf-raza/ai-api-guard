[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-api-guard"
version = "0.2.0"
description = "Reliability, observability, and cost-control toolkit for AI APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Muhammad Yousaf Raza" }
]
keywords = [
    "ai",
    "llm",
    "openai",
    "reliability",
    "observability",
    "retry",
    "cost-tracking"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "build>=1.2",
    "twine>=5.0",
]
openai = [
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/muhammad-yousaf-raza/ai-api-guard"
Repository = "https://github.com/muhammad-yousaf-raza/ai-api-guard"
Issues = "https://github.com/muhammad-yousaf-raza/ai-api-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_api_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true